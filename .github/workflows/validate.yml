name: Validate public API and skills
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-api.txt
      - run: python scripts/generate_openapi.py --check
      - run: python scripts/lint_openapi.py
      - run: python scripts/skill_openapi.py
      - run: python scripts/validate_skills.py
      - run: python scripts/check_trigger_coverage.py
      - run: python -m unittest discover -s tests -v
